name: Publish to NuGet.org

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/build-test.yml
    permissions:
      contents: read

  publish:
    name: Pack and Publish
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # GitVersion (packages/*.csproj) needs full history and tags, not the default shallow clone.
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Vendors templates/blazor/{wasm,server} in place (ADR 0027) before Dorn.Cli's None glob
      # sees the tree — this job runs in its own checkout, independent of build-test.yml's.
      - name: Vendor blazor template packs
        shell: pwsh
        run: ./eng/scripts/vendor-blazor-templates.ps1

      # GitVersion (packages/*.csproj) reads this exact tag on HEAD as the PackageVersion directly —
      # no -p:PackageVersion override needed, see ADR 0026.
      - name: Pack library packages
        run: |
          # nuget.config's dorn-local source must exist before the first restore, or NuGet errors NU1301.
          mkdir -p ./artifacts
          dotnet pack packages/Dorn.Messaging.Contracts/Dorn.Messaging.Contracts.csproj -c Release -o ./artifacts
          dotnet pack packages/Dorn.Messaging/Dorn.Messaging.csproj -c Release -o ./artifacts
          dotnet pack packages/Dorn.SharedKernel/Dorn.SharedKernel.csproj -c Release -o ./artifacts
          dotnet pack packages/Dorn.WebUI.Primitives/Dorn.WebUI.Primitives.csproj -c Release -o ./artifacts

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack Dorn.Cli
        run: >
          dotnet pack src/Dorn.Cli/Dorn.Cli.csproj
          --configuration Release
          --no-build
          -p:PackageVersion=${{ env.VERSION }}
          --output ./artifacts

      - name: Pack Dorn.Templates.WebApi
        shell: pwsh
        run: ./eng/scripts/pack-templates.ps1 -Version $env:VERSION

      - name: Verify generated packages
        run: |
          echo "Generated packages:"
          find artifacts -name "*.nupkg"

      - name: Smoke-test packed Dorn.Cli
        shell: pwsh
        run: ./eng/scripts/smoke-test-cli.ps1 -ArtifactsDirectory ${{ github.workspace }}/artifacts

      - name: Login to NuGet.org (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: mbarretot

      - name: Publish packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate \
            --force-english-output
