name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # v* tags run publish.yml, which calls the same matrix
  pull_request:

jobs:
  build-and-test:
    uses: ./.github/workflows/build-test.yml
    permissions:
      contents: read

# Releases publish via .github/workflows/publish.yml on `v*` tags (gated on this same build-test workflow) — see ADR 0020.
