name: build-test

on:
  workflow_call:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GitVersion (packages/*.csproj) needs full history and tags, not the default shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # No packages.lock.json anywhere in this repo (CPM via Directory.Packages.props only) — keyed on those files alone.
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Vendors templates/webapi in place (ADR 0028) — sources are no longer tracked in git, so
      # this step is load-bearing for every step below that touches templates/webapi/**.
      - name: Vendor webapi template pack
        shell: pwsh
        run: ./eng/scripts/vendor-webapi-templates.ps1

      - name: Cache ReportGenerator tool
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-reportgenerator-tool

      # DisableGitVersionTask: GitVersion computes a different version per branch/PR-merge-ref, but
      # this pin is a fixed product decision, not something to derive from git — see ADR 0026.
      - name: Pack Dorn's own NuGet packages (local feed for templates/webapi)
        shell: pwsh
        run: |
          $messagingVersion = (Select-String -Path templates/grpc/Directory.Packages.props -Pattern 'Dorn\.SharedKernel" Version="([^"]+)"').Matches[0].Groups[1].Value
          $webUiPrimitivesVersion = (Select-String -Path templates/blazor/wasm/Directory.Packages.props -Pattern 'Dorn\.WebUI\.Primitives" Version="([^"]+)"').Matches[0].Groups[1].Value

          # Cache key above is content-blind to these packages, so clear any stale extraction it restored.
          Get-ChildItem -Path "$HOME/.nuget/packages" -Filter "dorn.*" -Directory -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

          # nuget.config's dorn-local source must exist before the first restore, or NuGet errors NU1301.
          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null

          dotnet pack packages/Dorn.Messaging.Contracts/Dorn.Messaging.Contracts.csproj -c Release -o ./artifacts -p:DisableGitVersionTask=true "-p:PackageVersion=$messagingVersion"
          dotnet pack packages/Dorn.Messaging/Dorn.Messaging.csproj -c Release -o ./artifacts -p:DisableGitVersionTask=true "-p:PackageVersion=$messagingVersion"
          dotnet pack packages/Dorn.SharedKernel/Dorn.SharedKernel.csproj -c Release -o ./artifacts -p:DisableGitVersionTask=true "-p:PackageVersion=$messagingVersion"
          dotnet pack packages/Dorn.WebUI.Primitives/Dorn.WebUI.Primitives.csproj -c Release -o ./artifacts -p:DisableGitVersionTask=true "-p:PackageVersion=$webUiPrimitivesVersion"

      - name: Build and test gRPC template
        run: |
          dotnet restore templates/grpc/CleanArchGrpcService.slnx
          dotnet build templates/grpc/CleanArchGrpcService.slnx --no-restore -c Release
          dotnet test templates/grpc/CleanArchGrpcService.slnx --no-build -c Release

      - name: Restore
        run: dotnet restore Dorn.slnx

      - name: Build
        run: dotnet build Dorn.slnx --no-restore -c Release

      - name: Test
        env:
          DORN_TEMPLATES_PATH: ${{ github.workspace }}/templates
          DORN_LOCAL_NUGET_FEED: ${{ github.workspace }}/artifacts
        # Coverage collection only feeds the ubuntu-only aggregate/upload steps below; skipping it on windows avoids paying coverlet's instrumentation cost for unused output.
        # --settings enables MaxCpuCount (Dorn.runsettings, set to 1) so test projects run sequentially, avoiding nested-parallelism oversubscription on the runner's 4 vCPUs.
        run: >
          dotnet test Dorn.slnx --no-build -c Release --settings Dorn.runsettings
          ${{ matrix.os == 'ubuntu-latest' && '--collect:"XPlat Code Coverage"' || '' }}

      # Aggregates per-project cobertura reports via ReportGenerator; ubuntu-only since the upload step below reads a single source.
      - name: Aggregate coverage report (ReportGenerator)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: >
          if (-not (Test-Path ./.tools/reportgenerator)) {
            dotnet tool install --tool-path ./.tools/ dotnet-reportgenerator-globaltool
          };
          ./.tools/reportgenerator
          -reports:"**/coverage.cobertura.xml"
          -targetdir:"./coverage-report"
          -reporttypes:"Html;Cobertura;Badges"
          -assemblyfilters:"-Dorn.Cli.Tests;-Dorn.Core.Tests;-TemplateGenerationTests"

      - name: Upload coverage report as artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage-report
          retention-days: 30

      # Packaging smoke test: runs once (not per OS); version pinned from dotnet-tools.json to stay in sync with generated projects.
      - name: Pack Dorn.Cli (smoke test)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $version = (Get-Content templates/webapi/.config/dotnet-tools.json | ConvertFrom-Json).tools.'dorn.cli'.version
          dotnet pack src/Dorn.Cli/Dorn.Cli.csproj -c Release -o ./artifacts -p:PackageVersion=$version

      - name: Smoke-test packed Dorn.Cli
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./eng/scripts/smoke-test-cli.ps1 -ArtifactsDirectory ${{ github.workspace }}/artifacts
