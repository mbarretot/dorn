services:
  webapi:
    build:
      context: .
      dockerfile: src/CleanArchWebApi.WebApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CleanArchWebApi=Host=postgres;Port=5432;Database=CleanArchWebApi;Username=postgres;Password=${POSTGRES_PASSWORD:-Your_password123}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Your_password123}
      - POSTGRES_DB=CleanArchWebApi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  # otel-collector:   # placeholder — compose-path observability is out of scope
  #   image: otel/opentelemetry-collector-contrib:latest
  #   ports: ["4317:4317", "4318:4318"]
volumes:
  postgres-data:
